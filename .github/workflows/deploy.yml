# Every push to main checks the code, then deploys the backend and the web app.
#
# Repository secrets:  SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens)
#                      EXPO_TOKEN (expo.dev > Account settings > Access tokens)
# Repository variables: EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY,
#                      EXPO_PUBLIC_SUPABASE_FUNCTION_REGION (same values as .env)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: rjiurcealqkdoymejvos

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  backend:
    needs: check
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase db push
      - run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

  web:
    needs: backend
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SUPABASE_FUNCTION_REGION: ${{ vars.EXPO_PUBLIC_SUPABASE_FUNCTION_REGION }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web
      - run: npx eas-cli@latest deploy --prod --non-interactive
